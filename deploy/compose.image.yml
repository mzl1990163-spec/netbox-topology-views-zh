# ============================================================
# 镜像版一键部署(v2.0):NetBox 4.6.8 + 插件 + 256 图标
#
# 用法:
#   1) 新建目录,把本文件放进去(或直接放仓库 deploy/ 同级)
#   2) 新建 configuration/ 目录,放入 plugins.py 和 extra.py(从仓库 deploy/configuration/ 复制)
#   3) docker compose -f compose.image.yml up -d
#   4) 首次启动自动建库+迁移(约 1-2 分钟);就绪后需手动执行一次 collectstatic 填充图标
#
# 注意:镜像公开,无需 docker login;图标持久化在 ./icons 卷;
#       SECRET_KEY 已内置随机值,部署即用(如需恢复源服务器数据,请改为与源服务器一致)
# ============================================================
services:
  netbox: &netbox
    image: ghcr.io/mzl1990163-spec/netbox-topology-views-zh:1.0.1
    ports:
      - "8000:8080"
    volumes:
      - "./icons:/opt/netbox/netbox/static/netbox_topology_views/img"
      - "./configuration/plugins.py:/etc/netbox/config/plugins.py:ro"
      - "./configuration/extra.py:/etc/netbox/config/extra.py:ro"
    environment:
      SECRET_KEY: "zpEnXrvbqX6CzyVWRHRJ300T7v/l9qKG4VugY7lx3wQ8D+7uDEzhgQaVSNmMHMw/9uk="   # 已内置随机值,部署即用;如需恢复源服务器数据,请改为与源服务器一致
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      SUPERUSER_USERNAME: admin
      SUPERUSER_PASSWORD: "123456"
      SUPERUSER_EMAIL: "admin@example.com"
  netbox-worker:
    <<: *netbox
    ports: []
  netbox-housekeeping:
    <<: *netbox
    ports: []

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "netbox"
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
    volumes:
      - netbox-postgres:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    command: ["sh", "-c", "redis-server --appendonly yes"]

  redis-cache:
    image: redis:6-alpine

volumes:
  netbox-postgres:
